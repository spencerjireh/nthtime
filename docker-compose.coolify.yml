# Coolify-managed Docker Compose
#
# Routing: Coolify's SERVICE_FQDN_WEB_3000 auto-generates Traefik router
# labels. We add an explicit service label so Traefik knows the backend port.
# DB password uses SERVICE_PASSWORD_64_POSTGRES (auto-generated by Coolify).
# Networks are omitted -- Coolify auto-creates one per stack.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nthtime
      POSTGRES_USER: nthtime
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nthtime']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nthtime
      DB_USER: nthtime
      DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-unused}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-unused}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET must be set}
      FRONTEND_URL: ${FRONTEND_URL:?}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/api/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '3000'
    environment:
      SERVICE_FQDN_WEB_3000: ''
      SPRING_BOOT_URL: http://api:8080
      FRONTEND_URL: ${FRONTEND_URL:?}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:

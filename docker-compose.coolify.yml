# Coolify-managed Docker Compose
#
# Differences from docker-compose.yml:
#   - DB password uses SERVICE_PASSWORD_64_POSTGRES (auto-generated by Coolify)
#   - No ports: block on web -- SERVICE_FQDN_WEB_3000 tells Coolify's Traefik proxy
#     to route traffic to port 3000 and assign a domain
#   - Required env vars use :? to fail fast if unset in Coolify UI
#   - Networks are omitted -- Coolify auto-creates one per stack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nthtime
      POSTGRES_USER: nthtime
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nthtime']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nthtime
      DB_USER: nthtime
      DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?}
      ADMIN_SECRET: ${ADMIN_SECRET:?}
      FRONTEND_URL: ${FRONTEND_URL:?}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SERVICE_FQDN_WEB_3000: ''
      SPRING_BOOT_URL: http://api:8080
      FRONTEND_URL: ${FRONTEND_URL:?}
      # Optional feature flags (uncomment to disable):
      # NEXT_PUBLIC_FF_AUTH: 'false'
      # NEXT_PUBLIC_FF_SOLUTION_VIEW: 'false'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:

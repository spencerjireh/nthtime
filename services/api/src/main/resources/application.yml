spring:
  application:
    name: nthtime-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nthtime}
    username: ${DB_USER:nthtime}
    password: ${DB_PASSWORD:nthtime}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 7d

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
            redirect-uri: ${FRONTEND_URL:http://localhost:3000}/api/auth/callback/github
        provider:
          github:
            user-name-attribute: login

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Spring Session would otherwise name this "SESSION". The Next.js proxy,
        # server-api-client and SecurityConfig.deleteCookies all forward/clear
        # "JSESSIONID", so the session cookie must carry that name or the browser's
        # session never reaches this service and every request is anonymous.
        name: JSESSIONID
        http-only: true
        # `secure` is intentionally unset: with forward-headers-strategy above,
        # Spring derives it from request.isSecure(), so it is false on localhost
        # and true behind the TLS-terminating proxy in production.
        # `strict` would drop the cookie on the top-level redirect back from
        # github.com and break the OAuth callback.
        same-site: lax

nthtime:
  admin-secret: ${ADMIN_SECRET}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

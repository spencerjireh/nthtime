services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: nthtime
      POSTGRES_USER: nthtime
      POSTGRES_PASSWORD: nthtime
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nthtime']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata-dev:

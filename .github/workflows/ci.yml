name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nthtime
          POSTGRES_USER: nthtime
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nthtime -d nthtime"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -- Pack validation (unchanged) --

      - name: Validate packs (structural)
        run: pnpm validate

      - name: Validate packs (behavioral - JS/TS)
        run: pnpm validate:behavioral

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate packs (behavioral - Python)
        run: pnpm validate:python

      # -- Frontend --

      - name: Lint (affected)
        run: npx nx affected --target=lint

      - name: Lint dead code (knip + gradle analyze, warn-only)
        run: pnpm lint:dead
        continue-on-error: true

      - name: Typecheck (all)
        run: npx nx run-many --target=typecheck

      - name: Test (affected)
        run: npx nx affected --target=test -- --run

      - name: Build frontend (affected)
        run: npx nx affected --target=build

      # -- Spring Boot --

      - name: Build and test Spring Boot
        working-directory: services/api
        run: ./gradlew build --no-daemon
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: nthtime
          DB_USER: nthtime
          DB_PASSWORD: test_password
          GITHUB_CLIENT_ID: fake
          GITHUB_CLIENT_SECRET: fake
          ADMIN_SECRET: test_admin_secret
          FRONTEND_URL: http://localhost:3000

      # -- E2E (requires Spring Boot + Postgres) --

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Spring Boot for E2E
        working-directory: services/api
        run: ./gradlew bootRun --no-daemon &
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: nthtime
          DB_USER: nthtime
          DB_PASSWORD: test_password
          GITHUB_CLIENT_ID: fake
          GITHUB_CLIENT_SECRET: fake
          ADMIN_SECRET: test_admin_secret
          FRONTEND_URL: http://localhost:3000

      - name: Wait for Spring Boot
        run: |
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Spring Boot is ready"
              exit 0
            fi
            echo "Waiting for Spring Boot... ($i)"
            sleep 2
          done
          echo "Spring Boot failed to start within 120s"
          exit 1

      - name: Seed test data
        run: npx tsx tools/seed.ts --sync
        env:
          SPRING_BOOT_URL: http://localhost:8080
          ADMIN_SECRET: test_admin_secret

      - name: E2E tests
        run: npx nx e2e @nthtime/web
        env:
          SPRING_BOOT_URL: http://localhost:8080

      # -- Docker build verify --

      - name: Docker compose build
        run: docker compose build

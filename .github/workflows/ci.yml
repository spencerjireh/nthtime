name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      HAS_CONVEX: ${{ secrets.NEXT_PUBLIC_CONVEX_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packs (structural)
        run: pnpm validate

      - name: Validate packs (behavioral - JS/TS)
        run: pnpm validate:behavioral

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate packs (behavioral - Python)
        run: pnpm validate:python

      - name: Lint (affected)
        run: npx nx affected --target=lint

      - name: Typecheck (all)
        run: npx nx run-many --target=typecheck

      - name: Test (affected)
        run: npx nx affected --target=test -- --run

      - name: Build (affected)
        run: npx nx affected --target=build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}

      # -- Backend-dependent steps (skipped when secrets are not configured) --

      - name: Install Playwright browsers
        if: env.HAS_CONVEX == 'true'
        run: npx playwright install --with-deps chromium

      - name: Seed Convex (E2E data)
        if: env.HAS_CONVEX == 'true'
        run: npx tsx tools/seed.ts --sync
        env:
          CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}

      - name: E2E tests
        if: env.HAS_CONVEX == 'true'
        run: npx nx e2e @nthtime/web
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

      - name: Docker build (verify)
        if: env.HAS_CONVEX == 'true'
        run: docker build --build-arg NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }} -t nthtime-web .
